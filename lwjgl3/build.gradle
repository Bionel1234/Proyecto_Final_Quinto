// La carpeta "lwjgl3" es la que abre la ventana del juego en el escritorio
// y ejecuta el codigo de "core".
plugins {
    id 'application' // nos da los comandos "gradle run" y el empaquetado basico
}

// Las imagenes y sonidos del juego (carpeta assets de la raiz) se copian al
// compilado para que LibGDX las encuentre.
sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]

// La clase que se ejecuta al correr el juego.
application.mainClass = 'com.gladiador.juego.lwjgl3.Lwjgl3Launcher'

dependencies {
    // LibGDX para escritorio (usa LWJGL3 para la ventana y OpenGL para dibujar).
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    // Version "nativa" (dll) del motor de LibGDX para la computadora.
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    // El codigo del juego esta en el otro modulo.
    implementation project(':core')
}

// Configuracion del comando "gradle run":
// que se ejecute desde la carpeta assets para que encuentre las imagenes.
run {
    workingDir = rootProject.file('assets').path
    jvmArgs += "--enable-native-access=ALL-UNNAMED"
}
