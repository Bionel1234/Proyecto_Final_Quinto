// Configuracion general del proyecto (Gradle).
// El proyecto tiene dos carpetas de codigo: "core" (el juego) y "lwjgl3" (la ventana).

allprojects {
    apply plugin: 'idea'

    // De aca se descargan las librerias (LibGDX).
    repositories {
        mavenCentral()
    }

    // Importante para IntelliJ: usa la misma carpeta de salida que Gradle,
    // asi se puede usar "Build and run using IntelliJ IDEA" sin sorpresas.
    idea {
        module {
            outputDir = file('build/classes/java/main')
            testOutputDir = file('build/classes/java/test')
        }
    }
}

subprojects {
    apply plugin: 'java-library'

    // Necesita Java 17 para compilar.
    java.sourceCompatibility = 17
    java.targetCompatibility = 17

    // Que los textos del codigo se lean en UTF-8 (los acentos importan).
    [compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

    version = "$projectVersion"
    ext.appName = 'JorgeElUltimoGladiador2.0'
}
